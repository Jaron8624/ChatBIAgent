name: Harness quality gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare pinned test data
        run: python scripts/prepare_test_data.py
      - name: Run all deterministic tests
        run: python -m unittest discover -s tests -p 'test*.py' -v
